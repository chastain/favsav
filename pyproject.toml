[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "favsav"
version = "0.1.0"
description = "Back up Jellyfin-favorite media to a secondary disk"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["jellyfin", "backup", "media", "systemd"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Filesystems",
]
# No runtime dependencies, on purpose.
dependencies = []

[project.scripts]
favsav = "favsav.cli:main"

[project.urls]
Homepage = "https://github.com/echastain/favsav"
Issues = "https://github.com/echastain/favsav/issues"
Changelog = "https://github.com/echastain/favsav/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["favsav"]
